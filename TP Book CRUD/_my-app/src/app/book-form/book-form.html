<div class="container">
    <h1>{{ isEdit ? 'Edit Book' : 'Add New Book' }}</h1>

    <div *ngIf="loading" class="loading">Loading...</div>

    <form *ngIf="!loading" [formGroup]="bookForm" (ngSubmit)="onSubmit()" class="book-form">
        <div class="form-group">
            <label for="title">Title *</label>
            <input type="text" id="title" formControlName="title" class="form-control">
            <div *ngIf="bookForm.get('title')?.invalid && bookForm.get('title')?.touched" class="error">
                Title is required
            </div>
        </div>

        <div class="form-group">
            <label for="author">Author *</label>
            <input type="text" id="author" formControlName="author" class="form-control">
            <div *ngIf="bookForm.get('author')?.invalid && bookForm.get('author')?.touched" class="error">
                Author is required
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" [disabled]="bookForm.invalid || loading" class="btn btn-primary">
                {{ isEdit ? 'Update' : 'Create' }} Book
            </button>
            <button type="button" (click)="onCancel()" class="btn btn-secondary">Cancel</button>
        </div>
    </form>
</div>
